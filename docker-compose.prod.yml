services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ems_db}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ems_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ems_network

  backend:
    # Built on a workstation and pushed to the registry by
    # scripts/build_and_push.sh — the droplet only ever pulls it. There is
    # deliberately no `build:` key here so a stale local checkout on the server
    # can never silently produce a different image than the one you tested.
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set in .env (see .env.example)}
    restart: always
    environment:
      # NOTE: the +psycopg driver is required — only psycopg 3 is installed,
      # a bare postgresql:// URL resolves to psycopg2 and fails to start.
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ems_db}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # Pinned here so a stale .env baked into an image can never turn on
      # SQL echo (which logs customer data) or expose /docs in production.
      - ENVIRONMENT=production
      - DEBUG=False
      # Where the separately-hosted frontend is served from. Requests from any
      # origin not listed here are rejected by the browser.
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS must list the frontend origin, e.g. https://app.example.com}
      - SEED_ADMIN_USERNAME=${SEED_ADMIN_USERNAME:-admin}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@ems.local}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - ems_network

  # NOTE: there is no frontend service here. This droplet serves the API only;
  # the frontend is hosted separately. Because the frontend is therefore on a
  # different origin, it must be listed in CORS_ORIGINS (see .env) or the
  # browser will block its API calls.

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/letsencrypt:ro
      - ./nginx/certbot-www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - ems_network

  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/certbot-www:/var/www/certbot
    networks:
      - ems_network

networks:
  ems_network:
    driver: bridge

volumes:
  postgres_data_prod:
